display_information:
  name: LangGraph Workflow Orchestrator
  description: Multi-agent coordination system with stateful human-in-the-loop review.
  background_color: "#1a1a2e"
features:
  bot_user:
    display_name: AI Review Board
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  interactive_components:
    enabled: true
    request_url: https://your-public-host/slack/interactive
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:join
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
