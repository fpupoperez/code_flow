[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-team"
version = "1.0.0"
description = "LangGraph supervisor multi-agent workflow with human-in-the-loop review."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GUO" }]
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=0.3,<2",
    "langchain>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "langgraph-sdk>=0.1",
    "langgraph-checkpoint-postgres>=2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "slack-sdk>=3.33",
    "httpx>=0.27",
    "langsmith>=0.3",
    "langfuse>=3.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48",
    "opentelemetry-instrumentation-httpx>=0.48",
    "mlflow>=2.20",
    "nats-py>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
agent-team = "agent_team.cli:main"
slack-publisher = "slack_publisher.main:main"
workflow-resumer = "workflow_resumer.main:main"
slack-emulator = "slack_emulator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
